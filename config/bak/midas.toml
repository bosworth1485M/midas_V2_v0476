# Global settings for Midas_V2
mode = "backtest"            # one of: backtest, paper, live
env_file = ".env"            # where API keys would live (not required for smoke test)
out_root = "out"

[risk]
max_daily_loss = 300.0       # USD
max_r_per_trade = 150.0      # USD (stop risk)
halt_after_consec_losses = 3
cooldown_minutes_after_loss = 10

[execution]
dry_run = true               # set false only when you're truly ready
slippage_bps = 5
commission_per_share = 0.003

[data]
provider = "csv_local"       # or polygon, etc. (future)
data_root = "data/samples"

[logging]
level = "INFO"
log_dir = "logs"
rotate_bytes = 1048576
backup_count = 5
